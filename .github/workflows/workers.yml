# Builds the RunPod worker images (no local Docker needed) and pushes them to GHCR.
# Runs when a worker changes, or by hand from the Actions tab.
name: workers

on:
  push:
    branches: [main]
    paths: ["aesyr-studio-v2/workers/**", ".github/workflows/workers.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [blender, unimate]
    steps:
      - uses: actions/checkout@v4

      # The UniMate image (CUDA + torch + checkpoint) needs more disk than a runner has free.
      - name: Free disk space
        if: matrix.worker == 'unimate'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aesyr-${{ matrix.worker }}-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: aesyr-studio-v2/workers/${{ matrix.worker }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
